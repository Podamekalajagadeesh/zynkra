name: Server CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Check formatting
        working-directory: server
        run: npm run format:check

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Lint
        working-directory: server
        run: npm run lint
      - name: Typecheck
        working-directory: server
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Build
        working-directory: server
        run: npm run build

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Unit tests with coverage (threshold enforced by jest.config.js)
        working-directory: server
        # `coverageThreshold` in jest.config.js makes this step the coverage
        # gate itself: it fails if lines/statements/functions/branches drop
        # below the configured minimums. It supersedes the inline
        # coverage-summary.json check that used to live here.
        run: npm run test:coverage
      - name: Federation specs (signing, inbound verification, SSRF guards)
        working-directory: server
        # Standalone because the inbound-verification suite generates RSA keys
        # and performs DNS lookups; it is slower than a pure unit test.
        run: npm run test:federation
      - name: Claim-proving specs (E2EE, portability, federation discovery)
        working-directory: server
        # These three files were never executed by any script or CI step: both
        # `test:unit` and `test:coverage` pass --testPathIgnorePatterns=/test/,
        # and every other script names its paths explicitly. They are the only
        # evidence for the E2EE, portability, and WebFinger/NodeInfo claims.
        run: npm run test:claims
      - name: Core loop tests
        working-directory: server
        run: npm run test:core
      - name: HTTP integration suites (auth, posts, users, media, search, content formats)
        working-directory: server
        # The per-endpoint HTTP integration suites were previously executed by
        # no script and no CI step; this is the Wave 1 exit gate for the Core loop.
        run: npm run test:http
      - name: Core loop tests (real Postgres)
        working-directory: server
        run: npm run test:core-db
      - name: Marketplace listings + admin reports tests
        working-directory: server
        # `/marketplace/listings` and `/admin/reports` were called by the client
        # but had no server route (and `AdminService` was not even a registered
        # provider). These specs pin the routes and their auth rules.
        run: npm run test:admin-marketplace
      - name: Money path tests
        working-directory: server
        run: npx jest --runInBand --runTestsByPath test/money-path.test.ts test/payments.payouts.spec.ts test/payments.webhooks.spec.ts test/payments.reconciliation.spec.ts


  test-e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: E2E smoke tests
        working-directory: server
        run: npm run test:e2e
      - name: QA smoke tests
        working-directory: server
        run: npx jest --runInBand --runTestsByPath test/qa-smoke.test.ts

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      # Exits 1 on findings, so this job can now actually go red. It previously
      # ran a version of the script that always exited 0.
      - name: Security audit
        working-directory: server
        run: node scripts/security-audit.js
      # Informational for now: the dependency tree predates this job and is not
      # yet clean. Flip `continue-on-error` to false once it is.
      - name: Dependency audit (advisory)
        continue-on-error: true
        working-directory: server
        run: npm audit --audit-level=high
      # Verifies all 65+ migrations apply to an empty database. Slow (boots an
      # embedded Postgres), so it is advisory rather than blocking.
      - name: Validate migrations (advisory)
        continue-on-error: true
        working-directory: server
        run: npm run migration:verify
